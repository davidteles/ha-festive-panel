name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check dist/festive-overlay-card.js

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - name: Parse blueprints, themes and examples
        run: |
          python - <<'PY'
          import glob, yaml
          class L(yaml.SafeLoader): pass
          L.add_constructor("!input", lambda l, n: l.construct_scalar(n))
          for f in glob.glob("blueprints/**/*.yaml", recursive=True) + glob.glob("themes/*.yaml") + glob.glob("examples/*.yaml"):
              list(yaml.load_all(open(f), Loader=L))
              print("ok", f)
          PY

  hacs:
    # The HACS validator only accepts public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
